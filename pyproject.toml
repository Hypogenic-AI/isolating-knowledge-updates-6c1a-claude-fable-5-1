[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "arxiv>=4.0.1",
    "beautifulsoup4>=4.15.0",
    "datasets>=5.0.1",
    "huggingface-hub>=1.33.0",
    "matplotlib>=3.10.9",
    "openai>=3.24.0",
    "peft>=0.21.2",
    "pypdf>=6.19.0",
    "requests>=2.34.2",
    "scipy>=1.15.3",
    "statsmodels>=0.15.0",
    "tabulate>=0.10.0",
    "torch>=2.14.1",
    "transformers>=5.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
